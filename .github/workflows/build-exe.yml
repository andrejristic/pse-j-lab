name: build-exe
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
jobs:
  exe:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv .venv
          .venv/Scripts/pip install -e . pyinstaller
      - name: Inno Setup
        run: |
          if [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then choco install innosetup --no-progress -y; fi
      - name: Diagnose seal/verify (venv)
        run: |
          .venv/Scripts/python -c "import os,tempfile,pathlib; os.environ['PSE_JLAB_HOME']=tempfile.mkdtemp(); from jlab.lab import run; from jlab.lab.runner import verify_run; r=run('l5_logdet_consistency',{'dims':[4],'n_points':2},make_plots=False); print('run ok',r.ok); v=verify_run(r.id); print('verify',v); p=pathlib.Path(r.path); print('sha file',repr((p/'sha256').read_text())); print('rlen',len((p/'result.json').read_bytes()),'rec.sha',r.sha256)"
        continue-on-error: true
      - name: Build installer
        run: bash packaging/build_exe.sh
      - name: Install silently
        shell: pwsh
        working-directory: app
        run: |
          $setup = Get-ChildItem ..\dist\PSEJLab-Setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$env:RUNNER_TEMP\jlab" -Wait
          if (-not (Test-Path "$env:RUNNER_TEMP\jlab\pse-jlab.exe")) { throw "not installed" }
      - name: Selftest
        shell: pwsh
        run: |
          $p = Start-Process "$env:RUNNER_TEMP\jlab\pse-jlab.exe" -ArgumentList '--selftest' -PassThru -Wait -RedirectStandardOutput "$env:RUNNER_TEMP\st.log" -RedirectStandardError "$env:RUNNER_TEMP\ste.log"
          Write-Host "--- selftest stdout:"; Get-Content "$env:RUNNER_TEMP\st.log" -ErrorAction SilentlyContinue
          Write-Host "--- selftest stderr:"; Get-Content "$env:RUNNER_TEMP\ste.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "selftest failed ($($p.ExitCode))" }
      - uses: actions/upload-artifact@v4
        with:
          name: pse-jlab-exe
          path: dist/*.exe
